<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유수언 위키 - 신수들의 기록소</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언 위키</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="문서 검색 (이름, ID 등)">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="#characters" class="nav-link">전체 캐릭터</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <div class="wiki-outer-container">
        <main class="wiki-article">
            <h1 class="wiki-title">유수언 위키:대문</h1>
            <div class="wiki-subtitle">세상의 모든 신수 정보가 모이는 곳</div>
            
            <div class="wiki-content">
                <div class="portal-card">
                    <h2 style="margin-top:0; border:none; font-size:1.4rem;">👋 환영합니다!</h2>
                    <p>이곳은 애니메이션 <strong>'유수언(有兽焉)'</strong>에 등장하는 다양한 신수들과 캐릭터들의 정보를 집대성하는 공유 위키입니다. 여러분의 편집 참여로 더욱 풍성한 기록을 만들어갈 수 있습니다.</p>
                </div>

                <div style="margin-bottom: 3rem;">
                    <h2 id="featured">⭐ 주요 캐릭터 바로가기</h2>
                    <div id="featured-characters-grid" class="char-grid-portal">
                        <!-- JS injects here -->
                    </div>
                </div>

                <h2 id="characters">📜 전체 캐릭터 목록</h2>
                <div id="char-grid">
                    <!-- JS injects categories and cards here -->
                </div>
            </div>
        </main>

        <aside class="wiki-sidebar">
            <div class="sidebar-box">
                <div class="sidebar-title">🕒 최근 변경 내역</div>
                <div id="home-recent-list">
                    <!-- Recent items -->
                </div>
            </div>
            <div class="sidebar-box">
                <div class="sidebar-title">📢 편집 안내</div>
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 0.8rem;">
                    누구나 로그인을 통해 문서를 편집할 수 있습니다. 
                </p>
                <ul style="font-size: 0.75rem; color: #888; padding-left: 1.2rem;">
                    <li>마크다운 문법 지원</li>
                    <li>[[문서ID]]로 링크 생성</li>
                    <li>편집 요약 필수 작성</li>
                </ul>
            </div>
        </aside>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
