<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 편집 - 유수언 위키</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언 위키</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="문서 검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">전체 캐릭터</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <div class="wiki-outer-container" style="grid-template-columns: 1fr;">
        <main class="wiki-article" style="padding: 2rem;">
            <div class="wiki-tabs-wrapper">
                <h1 id="edit-title" style="font-size: 1.5rem; border: none; margin: 0;">문서 편집</h1>
                <div class="wiki-tabs">
                    <div class="wiki-tab active" id="tab-edit">편집</div>
                    <div class="wiki-tab" id="tab-preview">미리보기</div>
                </div>
            </div>

            <form id="edit-form">
                <div id="panel-edit" class="editor-wrap">
                    <div id="dynamic-sections">
                        <!-- JS injects fields here -->
                    </div>
                </div>

                <div id="panel-preview" class="editor-wrap" style="display: none;">
                    <div id="preview-content" class="wiki-content">
                        <!-- Preview renders here -->
                    </div>
                </div>

                <div class="edit-summary-wrap">
                    <label class="field-label">편집 요약 (필수)</label>
                    <input type="text" id="edit-summary" class="field-input" style="margin-bottom:0;" placeholder="예: 정보 보강, 오타 수정, 이미지 교체 등">
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-save">저장</button>
                    <a href="#" id="cancel-link" class="btn-cancel">취소</a>
                </div>
            </form>
        </main>
    </div>

    <script type="module" src="edit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
