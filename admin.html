<!-- 알림 벨 -->
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">●</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    
                    <!-- 알림 드롭다운 -->
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자 문의</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">
            <h1 style="margin-bottom:0; font-size: 1.6rem; letter-spacing: -0.5px; font-weight:900;">관리자 설정</h1>
            <button onclick="quickCreateDoc()" class="admin-btn">새 문서 만들기</button>
        </div>
        <p style="color:#666; margin-bottom:2rem;">회원 권한 관리 및 시스템 설정을 할 수 있습니다.</p>

        <div class="admin-tabs">
            <div class="admin-tab active" id="tab-btn-users" onclick="switchTab('users')">사용자 관리</div>
            <div class="admin-tab" id="tab-btn-wiki" onclick="switchTab('wiki')">문서 관리</div>
            <div class="admin-tab" id="tab-btn-settings" onclick="switchTab('settings')">공지/소식 관리</div>
        </div>

        <div id="tab-users" class="tab-panel active">
            <div id="admin-content">
                <div class="loading">사용자 목록을 불러오는 중...</div>
            </div>
        </div>

        <div id="tab-wiki" class="tab-panel">
            <div id="wiki-admin-content">
                <!-- JS handles this -->
            </div>
        </div>

        <div id="tab-settings" class="tab-panel">
            <div id="settings-admin-content">
                <!-- JS handles this -->
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            
            document.getElementById('tab-btn-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            
            // 전역 이벤트로 탭 전환 알림 (admin.js에서 감지 가능)
            window.dispatchEvent(new CustomEvent('adminTabSwitch', { detail: tabId }));
        }

        function quickCreateDoc() {
            const id = prompt("새로 만들 문서의 ID를 입력해 주세요 (영문/숫자 권장):");
            if (id && id.trim()) {
                location.href = `edit.html#${encodeURIComponent(id.trim())}`;
            }
        }
    </script>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자 문의</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="관리자에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="admin.js?v=5"></script>
</body>
</html>
