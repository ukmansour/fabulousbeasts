<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 설정 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: white; border: 1px solid var(--border-color); }
        .user-table th, .user-table td { padding: 1rem; border: 1px solid var(--border-color); text-align: left; }
        .user-table th { background: #f8f9fa; font-weight: 800; }
        .role-badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .role-admin { background: #fee2e2; color: #dc2626; }
        .role-member { background: #f3f4f6; color: #4b5563; }
        .toggle-btn { padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 0.85rem; }
        .toggle-btn:hover { background: #f8f9fa; }
        .loading { text-align: center; padding: 3rem; color: #666; }
        .admin-tabs { display: flex; gap: 0; margin-bottom: 2rem; border-bottom: 2px solid var(--primary-color); }
        .admin-tab { padding: 0.6rem 1.5rem; cursor: pointer; font-weight: 700; border: 1px solid #ddd; border-bottom: none; background: #f5f6f7; color: #666; }
        .admin-tab.active { background: white; color: var(--primary-color); border-top: 2px solid var(--primary-color); margin-bottom: -2px; }
        .admin-tab:hover:not(.active) { background: #eee; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .notice-textarea { width: 100%; min-height: 160px; padding: 1rem; border: 1px solid #ddd; border-top: none; border-radius: 0 0 4px 4px; font-size: 0.95rem; line-height: 1.7; resize: vertical; font-family: 'Consolas', monospace; }
        .notice-save-btn { margin-top: 1rem; padding: 0.7rem 2rem; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 1rem; }
        .notice-save-btn:hover { background: var(--primary-dark); }
        .admin-toolbar { display: flex; gap: 0.2rem; background: #f1f1f1; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px 4px 0 0; flex-wrap: wrap; margin-top: 0.3rem; }
        .admin-toolbar-btn { background: white; border: 1px solid #ccc; padding: 0.25rem 0.55rem; font-size: 0.78rem; cursor: pointer; font-weight: 700; border-radius: 2px; transition: 0.1s; }
        .admin-toolbar-btn:hover { background: var(--primary-light); border-color: var(--primary-color); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <nav class="top-nav">
                <a href="index.html" class="nav-link">홈</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h1 style="margin-bottom:0;">관리자 설정</h1>
            <button onclick="quickCreateDoc()" style="padding:0.6rem 1.2rem; background:var(--primary-color); color:white; border:none; border-radius:6px; font-weight:800; cursor:pointer; box-shadow:0 2px 10px rgba(0,160,233,0.2);">+ 새 문서 만들기</button>
        </div>
        <p style="color:#666; margin-bottom:2rem;">회원 권한 관리 및 시스템 설정을 할 수 있습니다.</p>

        <div class="admin-tabs">
            <div class="admin-tab active" id="tab-btn-users" onclick="switchTab('users')">사용자 관리</div>
            <div class="admin-tab" id="tab-btn-wiki" onclick="switchTab('wiki')">문서 관리</div>
            <div class="admin-tab" id="tab-btn-settings" onclick="switchTab('settings')">공지/소식 관리</div>
        </div>

        <div id="tab-users" class="tab-panel active">
            <div id="admin-content">
                <div class="loading">사용자 목록을 불러오는 중...</div>
            </div>
        </div>

        <div id="tab-wiki" class="tab-panel">
            <div id="wiki-admin-content">
                <!-- JS handles this -->
            </div>
        </div>

        <div id="tab-settings" class="tab-panel">
            <div id="settings-admin-content">
                <!-- JS handles this -->
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            
            document.getElementById('tab-btn-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            
            // 전역 이벤트로 탭 전환 알림 (admin.js에서 감지 가능)
            window.dispatchEvent(new CustomEvent('adminTabSwitch', { detail: tabId }));
        }

        function quickCreateDoc() {
            const id = prompt("새로 만들 문서의 ID를 입력해 주세요 (영문/숫자 권장):");
            if (id && id.trim()) {
                location.href = `edit.html#${encodeURIComponent(id.trim())}`;
            }
        }
    </script>

    <script type="module" src="admin.js?v=3"></script>
</body>
</html>
