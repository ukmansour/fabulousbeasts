<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 설정 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 0; border-bottom: 2px solid #555; }
        .admin-tab { padding: 0.8rem 1.8rem; cursor: pointer; font-weight: 700; border: 1px solid #ccc; border-bottom: none; background: #e1e1e1; color: #333; font-size: 0.9rem; transition: background 0.1s; }
        .admin-tab.active { background: white; color: #000; border: 2px solid #555; border-bottom: none; margin-bottom: -2px; z-index: 10; }
        .admin-tab:hover:not(.active) { background: #d1d1d1; }
        .tab-panel { border: 2px solid #555; border-top: none; background: white; padding: 2rem; }
        .tab-panel.active { display: block; }
        .admin-btn { padding: 0.6rem 1.2rem; background: #444; color: white; border: 1px solid #222; border-radius: 2px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        .admin-btn:hover { background: #333; }
        .loading { text-align: center; padding: 3rem; color: #666; font-family: monospace; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <nav class="top-nav">
                <a href="index.html" class="nav-link">홈</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">
            <h1 style="margin-bottom:0; font-size: 1.6rem; letter-spacing: -0.5px; font-weight:900;">관리자 설정</h1>
            <button onclick="quickCreateDoc()" class="admin-btn">새 문서 만들기</button>
        </div>
        <p style="color:#666; margin-bottom:2rem;">회원 권한 관리 및 시스템 설정을 할 수 있습니다.</p>

        <div class="admin-tabs">
            <div class="admin-tab active" id="tab-btn-users" onclick="switchTab('users')">사용자 관리</div>
            <div class="admin-tab" id="tab-btn-wiki" onclick="switchTab('wiki')">문서 관리</div>
            <div class="admin-tab" id="tab-btn-settings" onclick="switchTab('settings')">공지/소식 관리</div>
        </div>

        <div id="tab-users" class="tab-panel active">
            <div id="admin-content">
                <div class="loading">사용자 목록을 불러오는 중...</div>
            </div>
        </div>

        <div id="tab-wiki" class="tab-panel">
            <div id="wiki-admin-content">
                <!-- JS handles this -->
            </div>
        </div>

        <div id="tab-settings" class="tab-panel">
            <div id="settings-admin-content">
                <!-- JS handles this -->
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            
            document.getElementById('tab-btn-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            
            // 전역 이벤트로 탭 전환 알림 (admin.js에서 감지 가능)
            window.dispatchEvent(new CustomEvent('adminTabSwitch', { detail: tabId }));
        }

        function quickCreateDoc() {
            const id = prompt("새로 만들 문서의 ID를 입력해 주세요 (영문/숫자 권장):");
            if (id && id.trim()) {
                location.href = `edit.html#${encodeURIComponent(id.trim())}`;
            }
        }
    </script>

    <script type="module" src="admin.js?v=3"></script>
</body>
</html>
