<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 관계도 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .relationships-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .relationships-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .relationships-header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .relationships-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        /* 관계도 그리드 */
        .relationships-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .relationship-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
        }
        
        .relationship-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--shadow-hover);
            border-color: var(--primary-color);
        }
        
        .relationship-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        
        .relationship-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }
        
        .relationship-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .relationship-name:hover {
            color: var(--primary-color);
        }
        
        .relationship-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .relationship-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem;
            background: var(--bg-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .relationship-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(4px);
        }
        
        .relationship-type {
            flex-shrink: 0;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            min-width: 60px;
        }
        
        .rel-friend {
            background: #d1f4e0;
            color: #0d7d3f;
        }
        
        .rel-family {
            background: #ffd6a5;
            color: #8b5000;
        }
        
        .rel-rival {
            background: #ffd6d6;
            color: #c41e3a;
        }
        
        .rel-mentor {
            background: #d6e4ff;
            color: #1e40af;
        }
        
        .rel-ally {
            background: #e9d5ff;
            color: #7e22ce;
        }
        
        .dark-mode .rel-friend {
            background: #1a4d2e;
            color: #86efac;
        }
        
        .dark-mode .rel-family {
            background: #4d3500;
            color: #fbbf24;
        }
        
        .dark-mode .rel-rival {
            background: #4d1a1a;
            color: #fca5a5;
        }
        
        .dark-mode .rel-mentor {
            background: #1e3a5f;
            color: #93c5fd;
        }
        
        .dark-mode .rel-ally {
            background: #3b1e5f;
            color: #d8b4fe;
        }
        
        .relationship-target {
            flex: 1;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .relationship-empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }
        
        /* 필터 */
        .relationship-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }
        
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <nav class="top-nav">
                <a href="index.html" class="nav-link">홈</a>
                <a href="index.html#characters" class="nav-link">전체 캐릭터</a>
                <a href="watch.html" class="nav-link">애니 보기</a>
                <a href="community.html" class="nav-link">커뮤니티</a>
                <a href="relationships.html" class="nav-link active">관계도</a>
                
                <!-- 테마 토글 버튼 -->
                <button class="theme-toggle-btn" onclick="window.toggleThemeGlobal()" title="다크 모드로 전환">◐</button>
                
                <!-- 알림 벨 -->
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">●</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자 문의</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="relationships-container">
        <div class="relationships-header">
            <h1>🔗 캐릭터 관계도</h1>
            <p>캐릭터 간의 관계를 한눈에 확인하세요</p>
        </div>

        <div class="relationship-filters">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="friend">친구</button>
            <button class="filter-btn" data-filter="family">가족</button>
            <button class="filter-btn" data-filter="rival">라이벌</button>
            <button class="filter-btn" data-filter="mentor">스승/제자</button>
            <button class="filter-btn" data-filter="ally">동료</button>
        </div>

        <div id="relationships-grid" class="relationships-grid">
            <div class="relationship-empty">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⏳</div>
                <p>관계도를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자 문의</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="관리자에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="theme.js"></script>
    <script type="module" src="relationships.js"></script>
</body>
</html>
