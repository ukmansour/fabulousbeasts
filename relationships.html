<!-- 알림 벨 -->
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">●</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자 문의</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="relationships-container">
        <div class="relationships-header">
            <h1>🔗 캐릭터 관계도</h1>
            <p>캐릭터 간의 관계를 한눈에 확인하세요</p>
        </div>

        <div class="relationship-filters">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="friend">친구</button>
            <button class="filter-btn" data-filter="family">가족</button>
            <button class="filter-btn" data-filter="rival">라이벌</button>
            <button class="filter-btn" data-filter="mentor">스승/제자</button>
            <button class="filter-btn" data-filter="ally">동료</button>
        </div>

        <div id="relationships-grid" class="relationships-grid">
            <div class="relationship-empty">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⏳</div>
                <p>관계도를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자 문의</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="관리자에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="relationships.js"></script>
</body>
</html>
