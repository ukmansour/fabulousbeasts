<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니 시청 - 유수언</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .watch-container { max-width: 1200px; margin: 2rem auto; display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 0 1rem; }
        .video-player-wrap { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; box-shadow: var(--shadow-soft); }
        .episode-list-wrap { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; height: fit-content; }
        .ep-header { background: var(--primary-color); color: white; padding: 1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .ep-items { max-height: 600px; overflow-y: auto; }
        .ep-item { padding: 1rem; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: 0.2s; }
        .ep-item:hover { background: var(--primary-light); }
        .ep-item.active { background: var(--primary-light); border-left: 4px solid var(--primary-color); }
        .ep-num { font-weight: 800; color: var(--primary-color); min-width: 40px; }
        .ep-title { font-size: 0.95rem; font-weight: 500; }
        
        .video-info { margin-top: 1.5rem; background: white; padding: 1.5rem; border: 1px solid var(--border-color); border-radius: 8px; }
        .video-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .video-desc { color: #666; font-size: 0.95rem; }

        @media (max-width: 992px) {
            .watch-container { grid-template-columns: 1fr; }
            .episode-list-wrap { order: 2; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <a href="watch.html" class="nav-link active">애니 보기</a>
                <a href="community.html" class="nav-link">커뮤니티</a>
                
                <!-- 알림 벨 -->
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">알림</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    
                    <!-- 알림 드롭다운 -->
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자와 대화</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="watch-container">
        <div class="main-video-area">
            <div class="video-player-wrap">
                <video id="main-video" width="100%" height="100%" controls style="background: #000; outline: none;"></video>
            </div>
            <div class="video-info">
                <h1 class="video-title" id="display-title">에피소드를 선택해 주세요</h1>
                
                <!-- 댓글 영역 -->
                <div class="comments-section" style="margin-top: 1.5rem;">
                    <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; color: #333;">댓글 <span id="comments-count" style="color: var(--primary-color);">0</span></h3>
                    
                    <!-- 댓글 작성 폼 (로그인 시 노출) -->
                    <div id="comment-form-wrap" style="margin-bottom: 1.5rem;">
                        <!-- JS가 로그인 상태에 맞춰 처리합니다 -->
                    </div>

                    <!-- 댓글 목록 -->
                    <div id="comments-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- JS가 댓글들을 여기에 렌더링합니다 -->
                    </div>
                </div>
            </div>
        </div>

        <aside class="episode-list-wrap">
            <div class="ep-header">
                <span>에피소드 목록</span>
                <select id="season-select" style="padding: 0.2rem; border-radius: 4px; border: none; font-size: 0.8rem;">
                    <option value="1">시즌 1</option>
                    <option value="2">시즌 2</option>
                    <option value="3">시즌 3</option>
                    <option value="4">시즌 4</option>
                    <option value="5">시즌 5</option>
                    <option value="6">시즌 6</option>
                </select>
            </div>
            <div class="ep-items" id="episode-list">
                <!-- JS injects episodes here -->
            </div>
            
            <!-- 자막 다운로드 버튼 -->
            <div style="padding: 1rem; text-align: center; border-top: 1px solid #eee;">
                <a href="subtitles.html" style="display: inline-block; padding: 0.5rem 1rem; background: white; color: #333; border-radius: 6px; font-weight: 700; text-decoration: none; font-size: 0.85rem; transition: 0.2s;">
                    자막 다운로드
                </a>
            </div>
        </aside>
    </div>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자와 대화</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="hodu 님에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="watch.js"></script>
</body>
</html>
