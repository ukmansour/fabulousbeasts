<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니 시청 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .watch-container { max-width: 1200px; margin: 2rem auto; display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 0 1rem; }
        .video-player-wrap { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; box-shadow: var(--shadow-soft); }
        .episode-list-wrap { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; height: fit-content; }
        .ep-header { background: var(--primary-color); color: white; padding: 1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .ep-items { max-height: 600px; overflow-y: auto; }
        .ep-item { padding: 1rem; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: 0.2s; }
        .ep-item:hover { background: var(--primary-light); }
        .ep-item.active { background: var(--primary-light); border-left: 4px solid var(--primary-color); }
        .ep-num { font-weight: 800; color: var(--primary-color); min-width: 40px; }
        .ep-title { font-size: 0.95rem; font-weight: 500; }
        
        .video-info { margin-top: 1.5rem; background: white; padding: 1.5rem; border: 1px solid var(--border-color); border-radius: 8px; }
        .video-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .video-desc { color: #666; font-size: 0.95rem; }

        @media (max-width: 992px) {
            .watch-container { grid-template-columns: 1fr; }
            .episode-list-wrap { order: 2; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <a href="watch.html" class="nav-link active">애니 보기</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <div class="watch-container">
        <div class="main-video-area">
            <div class="video-player-wrap">
                <video id="main-video" width="100%" height="100%" controls autoplay style="background: #000; outline: none;"></video>
            </div>
            <div class="video-info">
                <h1 class="video-title" id="display-title">에피소드를 선택해 주세요</h1>
                <p class="video-desc" id="display-desc"></p>
            </div>
        </div>

        <aside class="episode-list-wrap">
            <div class="ep-header">
                <span>에피소드 목록</span>
                <select id="season-select" style="padding: 0.2rem; border-radius: 4px; border: none; font-size: 0.8rem;">
                    <option value="1">시즌 1</option>
                    <option value="2">시즌 2</option>
                    <option value="3">시즌 3</option>
                    <option value="4">시즌 4</option>
                    <option value="5">시즌 5</option>
                </select>
            </div>
            <div class="ep-items" id="episode-list">
                <!-- JS injects episodes here -->
            </div>
        </aside>
    </div>

    <script type="module" src="watch.js"></script>
</body>
</html>
