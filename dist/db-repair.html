<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터베이스 복구 도구 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .repair-container { max-width: 600px; margin: 4rem auto; padding: 2rem; background: white; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .warning-box { background: #fff1f0; border: 1px solid #ffa39e; padding: 1rem; margin: 1.5rem 0; color: #cf1322; font-size: 0.9rem; }
        .log-box { background: #f5f5f5; border: 1px solid #ccc; padding: 1rem; margin-top: 1.5rem; text-align: left; height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
        .btn-danger { background: #ff4d4f; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="repair-container">
        <h1>🛠 데이터베이스 복구 도구</h1>
        <p>유저 컬렉션을 초기화하고 깨끗한 상태로 다시 만듭니다.</p>
        
        <div class="warning-box">
            <strong>⚠️ 경고!</strong><br>
            이 작업을 진행하면 현재 등록된 <strong>모든 회원 명단</strong>이 삭제됩니다.<br>
            (Authentication의 계정 자체는 유지되지만, 닉네임과 권한 정보는 초기화됩니다.)
        </div>

        <div id="status-area">
            <p>보안 코드(5555)를 입력하여 작업을 시작하세요.</p>
            <button id="repair-btn" class="btn-danger">전체 유저 명단 초기화 및 재구성</button>
        </div>

        <div id="log" class="log-box">대기 중...</div>
        
        <div style="margin-top: 2rem;">
            <a href="index.html">홈으로 돌아가기</a>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, getDocs, doc, deleteDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const repairBtn = document.getElementById('repair-btn');
        const logArea = document.getElementById('log');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logArea.innerHTML += `[${time}] ${msg}<br>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                addLog("오류: 로그인이 필요합니다.");
                repairBtn.disabled = true;
                return;
            }
            addLog(`로그인 확인: ${user.displayName || user.email}`);
        });

        repairBtn.onclick = async () => {
            const password = prompt("명단 초기화를 위해 보안 코드(5555)를 입력하세요:");
            if (password !== "5555") {
                alert("코드 불일치");
                return;
            }

            if (!confirm("정말로 명단을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;

            repairBtn.disabled = true;
            addLog("작업 시작...");

            try {
                // 1. 모든 유저 문서 가져오기
                addLog("현재 유저 명단 조회 중...");
                const snap = await getDocs(collection(db, "users"));
                addLog(`총 ${snap.size}개의 문서를 발견했습니다.`);

                // 2. 하나씩 삭제
                let deletedCount = 0;
                for (const docSnap of snap.docs) {
                    await deleteDoc(doc(db, "users", docSnap.id));
                    deletedCount++;
                    addLog(`삭제 중: ${docSnap.id} (${deletedCount}/${snap.size})`);
                }
                addLog("전체 삭제 완료.");

                // 3. 현재 로그인한 본인을 관리자로 재등록
                const user = auth.currentUser;
                if (user) {
                    addLog("현재 사용자(${user.displayName})를 관리자로 재등록 중...");
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        nickname: user.displayName || "관리자",
                        role: 'admin',
                        joinedAt: serverTimestamp(),
                        contributionCount: 0
                    });
                    addLog("관리자 등록 성공!");
                }

                addLog("✅ 모든 작업이 완료되었습니다!");
                alert("명단이 초기화되었습니다. 이제 다른 사용자들은 사이트에 다시 접속하면 자동으로 '멤버'로 등록됩니다.");
            } catch (err) {
                addLog(`❌ 에러 발생: ${err.message}`);
                console.error(err);
            } finally {
                repairBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
