<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 정보 - 유수언 위키</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo" class="logo-img">
                <span>유수언 위키</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="문서 검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <div class="wiki-outer-container">
        <main class="wiki-article" id="wiki-article">
            <!-- Tabs -->
            <div class="wiki-tabs-container">
                <div class="wiki-tabs">
                    <div class="wiki-tab active">문서</div>
                    <div class="wiki-tab">토론</div>
                </div>
                <div class="wiki-tabs" id="action-tabs">
                    <!-- JS will inject Edit/History tabs here -->
                </div>
            </div>

            <!-- Content -->
            <div id="detail-container">
                <p style="padding: 2rem; color: #888;">데이터를 불러오는 중...</p>
            </div>
        </main>

        <aside class="wiki-sidebar">
            <div class="sidebar-box">
                <div class="sidebar-title">🕒 최근 변경 내역</div>
                <div id="recent-changes-list">
                    <!-- JS will inject recent changes -->
                    <p style="font-size: 0.8rem; color: #999;">불러오는 중...</p>
                </div>
            </div>
            <div class="sidebar-box">
                <div class="sidebar-title">⭐ 주요 캐릭터</div>
                <div id="featured-characters">
                    <!-- Quick links -->
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="detail.js"></script>
</body>
</html>
