<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TQX8FG22Y7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TQX8FG22Y7');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 상세 정보 - 유수언 위키</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .detail-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 2.5rem;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
        }
        .detail-main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 3rem;
            align-items: start;
        }
        .detail-left-col {
            min-width: 0;
        }
        
        /* 퀵네비게이션 상단 고정 및 스타일 */
        .sticky-nav-wrapper {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 1.5rem 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2.5rem;
        }
        .detail-quick-nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: none !important; /* 배경 박스 제거 */
        }
        .detail-quick-nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        .detail-quick-nav a:hover {
            color: var(--secondary-color);
        }

        .detail-right-col {
            position: relative;
            top: 0;
        }
        .detail-image-container {
            margin-bottom: 1.5rem;
        }
        .detail-image-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            object-fit: cover;
        }
        
        .infobox {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
        }
        .infobox-row {
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed #dee2e6;
        }
        .infobox-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .infobox-section-title {
            background: var(--primary-color);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            margin: 1.2rem 0 0.8rem 0;
            font-weight: 700;
            text-align: center;
        }

        .detail-section {
            margin-bottom: 4rem;
            scroll-margin-top: 120px; /* 이동 시 상단 여백 확보 */
        }
        .detail-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
            color: var(--primary-color);
        }
        .detail-content {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-color);
        }
        
        @media (max-width: 992px) {
            .detail-main-layout { grid-template-columns: 1fr; }
            .detail-right-col { position: static; max-width: 450px; margin: 0 auto 3rem auto; order: -1; }
            .sticky-nav-wrapper { top: 0; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo" class="logo-img">
                <span>유수언 위키</span>
            </a>
            <nav class="top-nav">
                <a href="index.html#home" class="nav-link">홈</a>
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <span id="user-info"></span>
            </nav>
        </div>
    </header>

    <main class="detail-page" id="detail-container">
        <p>캐릭터 정보를 불러오는 중...</p>
    </main>

    <script type="module" src="detail.js"></script>
</body>
</html>
