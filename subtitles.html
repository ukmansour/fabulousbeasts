<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자막 다운로드 - 유수언</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .subtitles-container { 
            max-width: 1200px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .subtitles-header {
            text-align: center;
            padding: 2rem 1rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #333;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-soft);
        }
        .subtitles-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0;
        }
        
        .season-section {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-soft);
        }
        .season-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #333;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subtitle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .subtitle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            transition: 0.2s;
            border: 1px solid #e9ecef;
        }
        .subtitle-item:hover {
            border-color: #dee2e6;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .subtitle-name {
            font-weight: 700;
            color: #333;
            font-size: 0.95rem;
        }
        .download-btn {
            padding: 0.4rem 0.8rem;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .download-btn:hover {
            background: #555;
            transform: scale(1.05);
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: #666;
        }
        
        .back-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            transition: 0.2s;
            margin-bottom: 2rem;
        }
        .back-btn:hover {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <a href="watch.html" class="nav-link">애니 보기</a>
                <a href="community.html" class="nav-link">커뮤니티</a>
                
                <!-- 알림 벨 -->
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">알림</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    
                    <!-- 알림 드롭다운 -->
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자와 대화</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="subtitles-container">
        <div id="subtitles-list" class="loading">
            자막 파일 목록을 불러오는 중...
        </div>
    </div>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자와 대화</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="hodu 님에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="subtitles.js"></script>
</body>
</html>
