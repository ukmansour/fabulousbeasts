<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자막 다운로드 - 유수언</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .subtitles-container { 
            max-width: 1200px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .subtitles-header {
            text-align: center;
            padding: 2rem 1rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #333;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-soft);
        }
        .subtitles-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0;
        }
        
        .season-section {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-soft);
        }
        .season-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #333;
            padding: 1rem 1.5rem;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subtitle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0;
            border: 1px solid #dee2e6;
        }
        .subtitle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.8rem;
            background: white;
            transition: 0.2s;
            border-right: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
        }
        .subtitle-item:hover {
            background: #f8f9fa;
        }
        .subtitle-name {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        .download-btn {
            padding: 0.3rem 0.6rem;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .download-btn:hover {
            background: #555;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: #666;
        }
        
        .back-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            transition: 0.2s;
            margin-bottom: 2rem;
        }
        .back-btn:hover {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" id="global-search" placeholder="검색...">
                <div class="search-results" id="search-results"></div>
            </div>
            <nav class="top-nav">
                <a href="index.html#characters" class="nav-link">캐릭터</a>
                <a href="watch.html" class="nav-link">애니 보기</a>
                <a href="community.html" class="nav-link">커뮤니티</a>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="subtitles-container">
        <div id="subtitles-list" class="loading">
            자막 파일 목록을 불러오는 중...
        </div>
    </div>

    <script type="module" src="subtitles.js"></script>
</body>
</html>
