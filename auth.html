<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 / 회원가입 - 유수언 위키</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 2.5rem;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 1rem;
            cursor: pointer;
            font-weight: 700;
            color: #666;
        }
        .auth-tab.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .auth-form input {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
        }
        .auth-btn {
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo" class="logo-img">
                <span>유수언 위키</span>
            </a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-tabs">
            <div class="auth-tab active" id="login-tab">로그인</div>
            <div class="auth-tab" id="signup-tab">회원가입</div>
        </div>

        <form id="auth-form" class="auth-form">
            <input type="email" id="email" placeholder="이메일" required>
            <input type="password" id="password" placeholder="비밀번호" required>
            <button type="submit" class="auth-btn" id="submit-btn">로그인</button>
        </form>
        <div id="error-message" class="error-message"></div>
    </main>

    <script type="module" src="auth.js"></script>
</body>
</html>
