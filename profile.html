<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - 유수언</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .profile-header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            flex-shrink: 0;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .profile-email {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .profile-stats {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        
        .profile-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .profile-stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
        }
        
        .profile-stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        .profile-tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
        }
        
        .profile-tab {
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        
        .profile-tab:hover {
            color: var(--primary-color);
        }
        
        .profile-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .profile-content {
            display: none;
        }
        
        .profile-content.active {
            display: block;
        }
        
        .activity-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        
        .activity-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }
        
        .activity-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .activity-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .activity-preview {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-tertiary);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="https://static.wikitide.net/youshouyanwiki/thumb/a/a0/YouShouTransparent2.png/450px-YouShouTransparent2.png" alt="Logo">
                <span>유수언</span>
            </a>
            <nav class="top-nav">
                <a href="index.html" class="nav-link">홈</a>
                <a href="index.html#characters" class="nav-link">전체 캐릭터</a>
                <a href="watch.html" class="nav-link">애니 보기</a>
                <a href="community.html" class="nav-link">커뮤니티</a>
                <a href="relationships.html" class="nav-link">관계도</a>
                <a href="search.html" class="nav-link">검색</a>
                
                <button class="theme-toggle-btn" onclick="window.toggleThemeGlobal()" title="다크 모드로 전환">◐</button>
                
                <div class="notification-bell" id="notification-bell" onclick="toggleNotificationDropdown()">
                    <span class="notification-bell-icon">●</span>
                    <span class="notification-badge" id="notification-badge">0</span>
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <h3>알림</h3>
                            <button class="notification-mark-all" onclick="markAllAsRead(); event.stopPropagation();">모두 읽음</button>
                        </div>
                        <div class="notification-list" id="notification-list">
                            <div style="padding: 2rem; text-align: center; color: #999;">알림이 없습니다</div>
                        </div>
                        <div class="notification-footer">
                            <button class="notification-contact-btn" onclick="openContactModal(); event.stopPropagation();">관리자 문의</button>
                        </div>
                    </div>
                </div>
                
                <span id="user-info" style="display:flex;align-items:center;gap:0.5rem;margin-left:0.5rem;white-space:nowrap;"></span>
            </nav>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">👤</div>
            <div class="profile-info">
                <div class="profile-name" id="profile-name">로딩 중...</div>
                <div class="profile-email" id="profile-email"></div>
                <div class="profile-stats">
                    <div class="profile-stat">
                        <div class="profile-stat-value" id="posts-count">0</div>
                        <div class="profile-stat-label">게시글</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-value" id="comments-count">0</div>
                        <div class="profile-stat-label">댓글</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-value" id="likes-count">0</div>
                        <div class="profile-stat-label">좋아요</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-tabs">
            <div class="profile-tab active" data-tab="posts">작성한 게시글</div>
            <div class="profile-tab" data-tab="comments">작성한 댓글</div>
            <div class="profile-tab" data-tab="favorites">즐겨찾기</div>
        </div>

        <div class="profile-content active" id="content-posts">
            <div id="posts-list"></div>
        </div>

        <div class="profile-content" id="content-comments">
            <div id="comments-list"></div>
        </div>

        <div class="profile-content" id="content-favorites">
            <div id="favorites-list"></div>
        </div>
    </div>

    <!-- 관리자 문의 모달 -->
    <div class="contact-modal" id="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-header">
                <h2>관리자 문의</h2>
                <button class="contact-modal-close" onclick="closeContactModal()">×</button>
            </div>
            <div class="contact-modal-body">
                <textarea id="contact-message" placeholder="관리자에게 전달할 메시지를 입력하세요..."></textarea>
            </div>
            <div class="contact-modal-footer">
                <button class="contact-cancel-btn" onclick="closeContactModal()">취소</button>
                <button class="contact-submit-btn" onclick="submitContact()">전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="notifications.js"></script>
    <script type="module" src="theme.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
